<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro Products Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-purple: #7C3AED;
            --accent-gold: #c5a028;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); padding: 16px; padding-bottom: 80px; }
        
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--brand-purple); }
        .header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .product-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03); transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        
        .product-img { width: 100%; height: 180px; object-fit: cover; background: #f1f5f9; }
        .product-content { padding: 16px; }
        .product-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .product-desc { font-size: 12px; color: var(--text-muted); margin: 6px 0 12px 0; line-height: 1.4; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--brand-purple); }
        
        .buy-btn { background: var(--brand-purple); color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .buy-btn:hover { background: #6D28D9; }
        
        .loading { text-align: center; padding: 50px; color: var(--text-muted); }
        
        /* Skeleton Animation */
        .skeleton { background: #e2e8f0; height: 200px; border-radius: 20px; margin-bottom: 16px; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Celestial Store</h1>
        <p>Premium Astro Products for your spiritual journey</p>
    </div>

    <div id="product-grid" class="grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <script>
        async function fetchProducts() {
            try {
                const res = await fetch('/api/admin/products');
                const data = await res.json();
                if (data.ok) renderProducts(data.products);
            } catch (e) {
                document.getElementById('product-grid').innerHTML = '<p class="loading">Failed to load products.</p>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = '<p class="loading">No products available at the moment.</p>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image || 'https://via.placeholder.com/400x300?text=Astro+Product'}" class="product-img">
                    <div class="product-content">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.description || 'Exclusive spiritual item from Astroluna.'}</div>
                        <div class="product-footer">
                            <div class="product-price">₹${p.price}</div>
                            <button class="buy-btn" onclick="handleBuy(${p.price}, '${p.name.replace(/'/g, "\\'")}', '${p.productId}')">Buy Now</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleBuy(price, name, id) {
            // 1. Try Android Bridge (App)
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.payWithBonusWallet) {
                AndroidBridge.payWithBonusWallet(price, name);
                return;
            }
            
            // 2. Try Parent Window (Web Iframe)
            if (window.parent && window.parent.payWithPurchaseWallet) {
                window.parent.payWithPurchaseWallet(price, name, id);
                return;
            }
            
            // 3. Fallback
            alert("Please login to the Astroluna app or website to purchase this product using your bonus wallet.");
        }

        // Functions called by Android/Web to update UI
        window.onPaymentSuccess = function(productName) {
            alert("Order Requested Successfully: " + productName + "\nWait for Admin approval.");
        };

        window.onPaymentError = function(error) {
            alert("Payment Failed: " + error);
        };

        fetchProducts();
    </script>
</body>
</html>
